<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <title>Blackcollar.io</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base styles */
        html,
        body {
            margin: 0 auto !important;
            padding: 0 !important;
            height: 100% !important;
            width: 100% !important;
            background: #ffffff;
        }
        
        * {
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
        }
        
        /* What it does: Centers email on Android 4.4 */
        div[style*="margin: 16px 0"] {
            margin: 0 !important;
        }
        
        /* What it does: Stops Outlook from adding extra spacing to tables. */
        table,
        td {
            mso-table-lspace: 0pt !important;
            mso-table-rspace: 0pt !important;
        }
        
        /* What it does: Fixes webkit padding issue. */
        table {
            border-spacing: 0 !important;
            border-collapse: collapse !important;
            table-layout: fixed !important;
            margin: 0 auto !important;
        }
        
        /* What it does: Uses a better rendering method when resizing images in IE. */
        img {
            -ms-interpolation-mode:bicubic;
        }
        
        /* What it does: A work-around for email clients meddling in triggered links. */
        a[x-apple-data-detectors],
        .unstyle-auto-detected-links a,
        .aBn {
            border-bottom: 0 !important;
            cursor: default !important;
            color: inherit !important;
            text-decoration: none !important;
            font-size: inherit !important;
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
        }
        
        /* What it does: Prevents Gmail from displaying a download button on large, non-linked images. */
        .a6S {
            display: none !important;
            opacity: 0.01 !important;
        }
        
        /* What it does: Prevents Gmail from changing the text color in conversation threads. */
        .im {
            color: inherit !important;
        }
        
        /* Media Queries */
        @media only screen and (max-width: 600px) {
            .email-container {
                width: 100% !important;
                margin: auto !important;
            }
            
            .stack-column,
            .stack-column-center {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                direction: ltr !important;
            }
            
            .center-on-narrow {
                text-align: center !important;
                display: block !important;
                margin-left: auto !important;
                margin-right: auto !important;
                float: none !important;
            }
            
            table.center-on-narrow {
                display: inline-block !important;
            }
        }
    </style>
</head>

<body width="100%" style="margin: 0; padding: 0 !important; mso-line-height-rule: exactly; background-color: #f5f5f5; font-family: 'Montserrat', Arial, sans-serif;">
    <center style="width: 100%; background-color: #f5f5f5;">
        <!-- Email Container -->
        <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="margin: auto;" class="email-container">
            
            <!-- HEADER -->
            <tr>
                <td style="padding: 40px 20px 20px 20px; text-align: center; background-color: #ffffff;">
                    <!-- Logo placeholder - replace with actual logo URL -->
                    <img src="{{LOGO_URL}}" width="180" height="auto" alt="Blackcollar.io" border="0" style="height: auto; font-family: 'Montserrat', sans-serif; font-size: 24px; line-height: 24px; color: #000000; font-weight: 700;">
                </td>
            </tr>
            
            <!-- MAIN CONTENT AREA -->
            <tr>
                <td style="padding: 0; background-color: #ffffff;">
                    <!-- CONTENT GOES HERE -->
                    {{CONTENT}}
                </td>
            </tr>
            
            <!-- FOOTER -->
            <tr>
                <td style="padding: 40px 20px; background-color: #ffffff; border-top: 1px solid #e5e5e5;">
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                        <tr>
                            <td style="padding: 0; text-align: center; font-family: 'Montserrat', Arial, sans-serif; font-size: 12px; line-height: 18px; color: #666666;">
                                <p style="margin: 0 0 10px 0;">
                                    © 2026 Blackcollar.io. All rights reserved.
                                </p>
                                <p style="margin: 0 0 10px 0;">
                                    <a href="{{DASHBOARD_URL}}" style="color: #000000; text-decoration: underline;">Dashboard</a> • 
                                    <a href="{{HELP_URL}}" style="color: #000000; text-decoration: underline;">Help Center</a> • 
                                    <a href="{{PRIVACY_URL}}" style="color: #000000; text-decoration: underline;">Privacy</a>
                                </p>
                                <p style="margin: 0; color: #999999; font-size: 11px;">
                                    You're receiving this email because you have an account with Blackcollar.io.<br>
                                    <a href="{{UNSUBSCRIBE_URL}}" style="color: #999999; text-decoration: underline;">Unsubscribe from marketing emails</a>
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            
        </table>
    </center>
</body>
</html>
