  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="theme-color" content="#0b0b0c" />
      <link rel="manifest" href="/manifest.webmanifest" />
      <title>Links.BlackCollar.io</title>
      <script>
        (function () {
          var match = location.pathname.match(/^\/([a-z0-9]{4,32})$/);
          if (!match) return;
          var api = '%VITE_API_URL%'.replace(/\/$/, '');
          if (!api) return;
          location.replace(api + '/' + match[1] + location.search + location.hash);
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
