  <!DOCTYPE html>
  <html lang="en" suppressHydrationWarning>
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <!-- Default dark; boot script + React sync to light/dark. Hex required for iOS status-bar tint. -->
      <meta name="theme-color" content="#0a0a0a" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="mobile-web-app-capable" content="yes" />
      <link rel="manifest" href="/manifest.webmanifest" />
      <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
      <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
      <title>Links.BlackCollar.io</title>
      <style>
        /* Paint before CSS bundle loads — iOS samples html/body for PWA chrome */
        html, body { background-color: #ffffff; }
        html.dark, html.dark body { background-color: #0a0a0a; }
      </style>
      <script>
        (function () {
          try {
            var storageKey = 'links-theme';
            var defaultTheme = 'system';
            var theme = localStorage.getItem(storageKey) || defaultTheme;
            var resolved = theme;
            if (theme === 'system') {
              resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
            }
            var root = document.documentElement;
            root.classList.remove('light', 'dark');
            var color = resolved === 'dark' ? '#0a0a0a' : '#ffffff';
            if (resolved === 'dark') {
              root.classList.add('dark');
              root.style.colorScheme = 'dark';
            } else {
              root.classList.add('light');
              root.style.colorScheme = 'light';
            }
            root.style.backgroundColor = color;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', color);
          } catch (e) {}
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
